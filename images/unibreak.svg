<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <rect width="500" height="300" fill="#1a1a2e"/>
  <rect x="20" y="20" width="460" height="260" rx="8" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="250" y="80" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#e94560">UniBreak</text>
  <text x="250" y="110" text-anchor="middle" font-family="Arial" font-size="12" fill="#a0a0b0">Unified Evolutionary Token-Level</text>
  <text x="250" y="128" text-anchor="middle" font-family="Arial" font-size="12" fill="#a0a0b0">Jailbreaking Framework for LLMs</text>
  <!-- LLM boxes -->
  <rect x="60" y="155" width="80" height="40" rx="5" fill="#0f3460" stroke="#e94560" stroke-width="1.5"/>
  <text x="100" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="white">LLM</text>
  <rect x="210" y="155" width="80" height="40" rx="5" fill="#533483" stroke="#a855f7" stroke-width="1.5"/>
  <text x="250" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Evolve</text>
  <rect x="360" y="155" width="80" height="40" rx="5" fill="#0f3460" stroke="#e94560" stroke-width="1.5"/>
  <text x="400" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="white">Attack ✓</text>
  <!-- Arrows -->
  <line x1="140" y1="175" x2="210" y2="175" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="175" x2="360" y2="175" stroke="#e94560" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e94560"/>
    </marker>
  </defs>
  <text x="250" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#606080">IEEE Trans. Evolutionary Computation 2026</text>
  <text x="250" y="258" text-anchor="middle" font-family="Arial" font-size="10" fill="#606080">You et al.</text>
</svg>
