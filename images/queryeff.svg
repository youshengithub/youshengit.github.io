<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <rect width="500" height="300" fill="#0c1929"/>
  <rect x="20" y="20" width="460" height="260" rx="8" fill="#0a1520" stroke="#3b82f6" stroke-width="2"/>
  <text x="250" y="68" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#3b82f6">Query-Efficient AE Attack</text>
  <text x="250" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="#93c5fd">Multi-Objective Optimization for Defensive DNNs</text>
  <!-- DNN boxes -->
  <rect x="30" y="115" width="90" height="50" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="75" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Adversarial</text>
  <text x="75" y="154" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Example</text>
  <rect x="200" y="115" width="100" height="50" rx="6" fill="#1e1e5f" stroke="#6366f1" stroke-width="1.5"/>
  <text x="250" y="137" text-anchor="middle" font-family="Arial" font-size="10" fill="white">GA + PSO</text>
  <text x="250" y="153" text-anchor="middle" font-family="Arial" font-size="10" fill="#a5b4fc">Optimizer</text>
  <rect x="375" y="115" width="90" height="50" rx="6" fill="#1e3a1e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="420" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Defensive</text>
  <text x="420" y="154" text-anchor="middle" font-family="Arial" font-size="10" fill="white">DNN ✓</text>
  <!-- Arrows -->
  <line x1="120" y1="140" x2="200" y2="140" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowb)"/>
  <line x1="300" y1="140" x2="375" y2="140" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowb)"/>
  <defs>
    <marker id="arrowb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <!-- Objectives -->
  <text x="250" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Objectives: Effectiveness · Evasiveness · Coverage</text>
  <text x="250" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">IEEE Trans. Evolutionary Computation 2022</text>
  <text x="250" y="258" text-anchor="middle" font-family="Arial" font-size="10" fill="#374151">Jiang, You et al., Vol.27, No.4, pp.832-847</text>
</svg>
