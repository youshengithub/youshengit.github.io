  <text x="250" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#4a6050">IEEE Trans. Evolutionary Computation 2025</text>
  <text x="250" y="258" text-anchor="middle" font-family="Arial" font-size="10" fill="#4a6050">You et al., Vol.30, No.3, pp.1108-1122</text>
</svg>
